<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘 야외활동 가능?</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e5e7eb;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --yellow: #d97706;
      --yellow-bg: #fef3c7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #edf4ff 0%, var(--bg) 240px);
      color: var(--text);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 22px 16px 46px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin: 8px 0 24px; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 50px); letter-spacing: -0.05em; font-weight: 900; }
    .sub { color: var(--muted); margin-top: 8px; font-size: 18px; line-height: 1.5; font-weight: 600; }
    .pill {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.8);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--muted);
    }
    
    /* 대시보드 레이아웃 */
    .grid { display: grid; grid-template-columns: 1.5fr 0.5fr; gap: 20px; }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
    
    .card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid rgba(229,231,235,.8); }
    
    /* 메인 결과 화면 (교실용 뷰) */
    .statusCard { 
      min-height: 500px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }
    .statusCenter {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 30px 0;
    }
    .statusIcon { width: 140px; height: 140px; border-radius: 40px; display: grid; place-items: center; font-size: 80px; flex: 0 0 auto; }
    .statusTitle { font-size: clamp(60px, 8vw, 110px); font-weight: 900; letter-spacing: -0.06em; line-height: 1.1; margin: 24px 0 0; }
    .statusDesc { display: none; } /* 긴 설명문 숨김 */
    
    .possible .statusIcon { background: var(--green-bg); color: var(--green); }
    .possible .statusTitle { color: var(--green); }
    .caution .statusIcon { background: var(--yellow-bg); color: var(--yellow); }
    .caution .statusTitle { color: var(--yellow); }
    .ban .statusIcon { background: var(--red-bg); color: var(--red); }
    .ban .statusTitle { color: var(--red); }
    .unknown .statusIcon { background: var(--blue-bg); color: var(--blue); }
    .unknown .statusTitle { color: var(--blue); }
    
    .reasons { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; width: 100%; align-items: center; }
    .reason { 
      border: 1px solid var(--line); 
      background: #fafafa; 
      border-radius: 18px; 
      padding: 16px 24px; 
      font-weight: 800; 
      font-size: 24px; 
      text-align: center;
      width: 100%;
      max-width: 500px;
      color: #1f2937;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    
    .metricGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; margin-top: 20px; }
    @media (max-width: 760px) { .metricGrid { grid-template-columns: repeat(2, 1fr); } }
    .metric { background: #f9fafb; border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-align: center; }
    .metric .k { color: var(--muted); font-size: 14px; font-weight: 800; }
    .metric .v { margin-top: 8px; font-size: 26px; font-weight: 900; letter-spacing: -0.03em; }
    
    /* 우측 설정 및 기타 UI */
    .controls { display: grid; gap: 12px; }
    label { display: block; font-size: 14px; font-weight: 800; margin-bottom: 6px; color: #344054; }
    select, input, button {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font: inherit; background: white; font-size: 15px;
    }
    button { cursor: pointer; border: 0; background: var(--blue); color: white; font-weight: 900; box-shadow: 0 8px 18px rgba(37, 99, 235, .22); font-size: 16px; }
    button.secondary { background: #111827; box-shadow: none; }
    button.ghost { background: white; color: #344054; border: 1px solid var(--line); box-shadow: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    
    .sectionTitle { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 16px; }
    .sectionTitle h2 { margin: 0; font-size: 22px; letter-spacing: -0.04em; }
    
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    @media (max-width: 760px) { .calendar { grid-template-columns: repeat(2, 1fr); } }
    .day { border: 1px solid var(--line); border-radius: 16px; padding: 14px 10px; min-height: 110px; background: #fff; text-align: center; }
    .day .date { font-size: 14px; color: var(--muted); font-weight: 800; }
    .day .state { margin-top: 10px; font-weight: 900; font-size: 20px; }
    .day .small { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.4; word-break: keep-all; }
    .day.possible { background: var(--green-bg); border-color: #86efac; color: var(--green); }
    .day.caution { background: var(--yellow-bg); border-color: #fcd34d; color: var(--yellow); }
    .day.ban { background: var(--red-bg); border-color: #fecaca; color: var(--red); }
    
    .notice { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 18px; padding: 16px; color: #334155; line-height: 1.55; font-size: 15px; }
    .smallText { font-size: 13px; color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>오늘 야외활동 가능?</h1>
        <div class="sub">미세먼지와 폭염특보를 확인하여 자동으로 알려줍니다.</div>
      </div>
      <div class="pill" id="lastUpdated">아직 조회 전</div>
    </header>

    <div class="grid">
      <main class="card statusCard unknown" id="statusCard">
        <div class="statusCenter">
          <div class="statusIcon" id="statusIcon">?</div>
          <p class="statusTitle" id="statusTitle">조회 중...</p>
          <div class="reasons" id="reasons"></div>
        </div>
        
        <div class="metricGrid">
          <div class="metric"><div class="k">미세먼지 (PM10)</div><div class="v" id="pm10">-</div></div>
          <div class="metric"><div class="k">초미세먼지 (PM2.5)</div><div class="v" id="pm25">-</div></div>
          <div class="metric"><div class="k">폭염특보 현황</div><div class="v" id="heatWarning">-</div></div>
          <div class="metric"><div class="k">현재 설정 지역</div><div class="v" id="regionLabel">-</div></div>
        </div>
      </main>

      <aside class="card">
        <div class="sectionTitle"><h2>설정</h2><button class="ghost" id="resetBtn" style="width:auto;padding:8px 12px">초기화</button></div>
        <div class="controls">
          <div>
            <label for="regionSelect">지역 선택</label>
            <select id="regionSelect"></select>
          </div>
          <div id="customBox" class="hidden">
            <div class="row">
              <div><label for="customName">표시 지역명</label><input id="customName" placeholder="예: 광주광역시 광산구" /></div>
              <div><label for="customStation">에어코리아 측정소명</label><input id="customStation" placeholder="예: 송정1동" /></div>
            </div>
            <div style="margin-top:10px"><label for="customWarnArea">특보 지역명 검색어</label><input id="customWarnArea" placeholder="예: 광주광역시" /></div>
          </div>
          <button id="saveBtn">설정 저장</button>
          <button class="secondary" id="checkBtn">새로고침 (다시 조회)</button>
        </div>
        
        <div class="sectionTitle" style="margin-top: 36px;"><h2>판단 기준</h2></div>
        <div class="notice">
          <b>금지</b>: 폭염경보, 미세먼지 매우나쁨/경보<br />
          <b>자제</b>: 폭염주의보, 미세먼지 나쁨<br />
          <b>가능</b>: 위 조건에 해당하지 않음
        </div>
      </aside>
    </div>

    <section class="card" style="margin-top:20px">
      <div class="sectionTitle"><h2>최근 7일 기록</h2><span class="smallText">브라우저에 자동 저장</span></div>
      <div class="calendar" id="calendar"></div>
    </section>
  </div>

  <script>
    const SERVICE_KEY = "9e644bbc9679873e697c8e70127dc6c6d1073968698887cef1fc34aba8e0a36c";
    const AIRKOREA_URL = "https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty";
    const KMA_WARN_URL = "https://apis.data.go.kr/1360000/WthrWrnInfoService/getWthrWrnList";

    const REGIONS = [
      { id: "gwangju-gwangsan", name: "광주광역시 광산구", stationName: "송정1동", warnArea: "광주" },
      { id: "gwangju-bukgu", name: "광주광역시 북구", stationName: "건국동", warnArea: "광주" },
      { id: "gwangju-seogu", name: "광주광역시 서구", stationName: "농성동", warnArea: "광주" },
      { id: "seoul-jongno", name: "서울특별시 종로구", stationName: "종로구", warnArea: "서울" },
      { id: "busan-haeundae", name: "부산광역시 해운대구", stationName: "좌동", warnArea: "부산" },
      { id: "custom", name: "직접 입력", stationName: "", warnArea: "" }
    ];

    const LS = {
      settings: "outdoor_activity_settings_v1",
      history: "outdoor_activity_history_v1"
    };

    const $ = (id) => document.getElementById(id);

    function todayKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function ymdhm(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${d} ${h}:${min}`;
    }

    function kmaTime(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      return `${y}${m}${d}${h}${min}`;
    }

    function loadSettings() {
      try { return JSON.parse(localStorage.getItem(LS.settings)) || {}; }
      catch { return {}; }
    }

    function saveSettings(settings) {
      localStorage.setItem(LS.settings, JSON.stringify(settings));
    }

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(LS.history)) || {}; }
      catch { return {}; }
    }

    function saveHistory(history) {
      localStorage.setItem(LS.history, JSON.stringify(history));
    }

    function getSelectedRegion() {
      const settings = loadSettings();
      if (settings.regionId === "custom") {
        return {
          id: "custom",
          name: settings.customName || "직접 입력 지역",
          stationName: settings.customStation || "",
          warnArea: settings.customWarnArea || ""
        };
      }
      return REGIONS.find(r => r.id === settings.regionId) || REGIONS[0];
    }

    function initRegionSelect() {
      const select = $("regionSelect");
      select.innerHTML = REGIONS.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
      const settings = loadSettings();
      select.value = settings.regionId || REGIONS[0].id;
      $("customName").value = settings.customName || "";
      $("customStation").value = settings.customStation || "";
      $("customWarnArea").value = settings.customWarnArea || "";
      toggleCustom();
    }

    function toggleCustom() {
      $("customBox").classList.toggle("hidden", $("regionSelect").value !== "custom");
    }

    function classifyDust(pm10, pm25) {
      const p10 = Number(pm10);
      const p25 = Number(pm25);
      let level = "good";
      let label = "좋음/보통";
      let reason = "미세먼지 양호";

      if ((Number.isFinite(p10) && p10 >= 300) || (Number.isFinite(p25) && p25 >= 150)) {
        level = "ban";
        label = "경보 수준";
        reason = "미세먼지 경보 발령";
      } else if ((Number.isFinite(p10) && p10 >= 151) || (Number.isFinite(p25) && p25 >= 76)) {
        level = "ban";
        label = "매우나쁨";
        reason = "미세먼지 매우나쁨";
      } else if ((Number.isFinite(p10) && p10 >= 81) || (Number.isFinite(p25) && p25 >= 36)) {
        level = "caution";
        label = "나쁨";
        reason = "미세먼지 나쁨";
      }
      return { level, label, reason };
    }

    function classifyHeat(text) {
      const t = String(text || "");
      if (/폭염.*경보|경보.*폭염/.test(t)) return { level: "ban", label: "경보", reason: "폭염경보 발령" };
      if (/폭염.*주의보|주의보.*폭염/.test(t)) return { level: "caution", label: "주의보", reason: "폭염주의보 발령" };
      return { level: "good", label: "특보 없음", reason: "폭염특보 없음" };
    }

    async function fetchAirKorea(serviceKey, stationName) {
      const queryParams = new URLSearchParams({
        returnType: "json",
        numOfRows: "24",
        pageNo: "1",
        stationName: stationName,
        dataTerm: "DAILY",
        ver: "1.4"
      });
      const url = `${AIRKOREA_URL}?serviceKey=${serviceKey}&${queryParams.toString()}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`네트워크 오류 (${res.status})`);
      
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error(`API 인증 또는 파싱 오류`);
      }

      const header = data?.response?.header;
      if (header && header.resultCode !== "00") {
        throw new Error(`서버 오류: ${header.resultMsg}`);
      }

      const items = data?.response?.body?.items || [];
      if (!items.length) {
        throw new Error(`'${stationName}' 측정소 데이터 없음`);
      }

      const item = items.find(x => x.pm10Value && x.pm10Value !== '-' && x.pm25Value && x.pm25Value !== '-') || items[0];
      return {
        pm10: item.pm10Value,
        pm25: item.pm25Value,
        dataTime: item.dataTime,
        stationName
      };
    }

    async function fetchKmaHeatWarning(serviceKey, warnArea) {
      const now = new Date();
      const from = new Date(now.getTime() - 1000 * 60 * 60 * 24 * 7);
      
      const queryParams = new URLSearchParams({
        pageNo: "1",
        numOfRows: "100",
        dataType: "JSON",
        fromTmFc: kmaTime(from),
        toTmFc: kmaTime(now)
      });
      const url = `${KMA_WARN_URL}?serviceKey=${serviceKey}&${queryParams.toString()}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`기상청 오류 (${res.status})`);
      
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } 
      catch (e) { throw new Error("기상청 응답 오류"); }

      const header = data?.response?.header;
      if (header && header.resultCode !== "00") throw new Error(`기상청 서버 오류`);

      const items = data?.response?.body?.items?.item || [];
      const list = Array.isArray(items) ? items : [items].filter(Boolean);

      const filtered = list
        .map(item => JSON.stringify(item))
        .filter(text => text.includes("폭염") && (!warnArea || text.includes(warnArea)));

      if (!filtered.length) return { raw: "", label: "특보 없음", level: "good", reason: "폭염특보 없음" };

      const joined = filtered.join("\n");
      if (/해제/.test(joined) && !/폭염.*(주의보|경보)|주의보.*폭염|경보.*폭염/.test(joined.replace(/해제/g, ""))) {
        return { raw: joined, label: "특보 없음", level: "good", reason: "폭염특보 없음" };
      }
      return { raw: joined, ...classifyHeat(joined) };
    }

    function decide({ dust, heat, air, region }) {
      const reasons = [];
      let state = "possible";
      let title = "야외활동 가능";
      let icon = "✓";

      if (dust.level === "ban") reasons.push(dust.reason);
      if (heat.level === "ban") reasons.push(heat.reason);
      if (!reasons.length && dust.level === "caution") reasons.push(dust.reason);
      if (!reasons.length && heat.level === "caution") reasons.push(heat.reason);
      if (dust.level === "caution" && heat.level === "caution") reasons.push(heat.reason);

      if (dust.level === "ban" || heat.level === "ban") {
        state = "ban";
        title = "야외활동 금지";
        icon = "!";
      } else if (dust.level === "caution" || heat.level === "caution") {
        state = "caution";
        title = "야외활동 자제";
        icon = "△";
      } else {
        reasons.push("날씨가 활동하기 좋습니다");
      }

      return { state, title, icon, reasons };
    }

    function renderResult(result, air, heat, region) {
      const card = $("statusCard");
      card.className = `card statusCard ${result.state}`;
      $("statusIcon").textContent = result.icon;
      $("statusTitle").textContent = result.title;
      $("pm10").textContent = `${air.pm10}㎍/㎥`;
      $("pm25").textContent = `${air.pm25}㎍/㎥`;
      $("heatWarning").textContent = heat.label;
      $("regionLabel").textContent = region.name.replace("광주광역시 ", "광주 ");
      $("lastUpdated").textContent = `최종 갱신: ${ymdhm()}`;
      $("reasons").innerHTML = result.reasons.map(r => `<div class="reason">${r}</div>`).join("");
    }

    function renderError(err) {
      console.error(err);
      const card = $("statusCard");
      card.className = "card statusCard unknown";
      $("statusIcon").textContent = "?";
      $("statusTitle").textContent = "조회 실패";
      $("reasons").innerHTML = `<div class="reason" style="color:var(--red); font-size:20px;">설정 측정소명을 확인해주세요</div>`;
      $("lastUpdated").textContent = `조회 오류`;
    }

    function recordHistory(result, air, heat, region) {
      const history = loadHistory();
      history[todayKey()] = {
        state: result.state,
        title: result.title,
        pm10: air.pm10,
        pm25: air.pm25,
        heat: heat.label,
        checkedAt: ymdhm()
      };
      saveHistory(history);
      renderCalendar();
    }

    function renderCalendar() {
      const history = loadHistory();
      const days = [];
      const now = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const key = todayKey(d);
        const item = history[key];
        const state = item?.state || "unknown";
        const label = state === "ban" ? "금지" : state === "caution" ? "자제" : state === "possible" ? "가능" : "기록 없음";
        days.push(`
          <div class="day ${state}">
            <div class="date">${d.getMonth() + 1}/${d.getDate()}</div>
            <div class="state">${label}</div>
            <div class="small">${item ? `${item.heat}<br>PM10: ${item.pm10}` : "-"}</div>
          </div>
        `);
      }
      $("calendar").innerHTML = days.join("");
    }

    async function checkNow() {
      const region = getSelectedRegion();
      if (!region.stationName) throw new Error("측정소명 누락");

      $("checkBtn").textContent = "조회 중...";
      $("checkBtn").disabled = true;
      try {
        const air = await fetchAirKorea(SERVICE_KEY, region.stationName);
        const dust = classifyDust(air.pm10, air.pm25);
        let heat;
        try { heat = await fetchKmaHeatWarning(SERVICE_KEY, region.warnArea); } 
        catch (e) { heat = { level: "good", label: "확인 실패", reason: "폭염특보 확인 실패" }; }
        
        const result = decide({ dust, heat, air, region });
        renderResult(result, air, heat, region);
        recordHistory(result, air, heat, region);
      } catch (err) {
        renderError(err);
      } finally {
        $("checkBtn").textContent = "새로고침 (다시 조회)";
        $("checkBtn").disabled = false;
      }
    }

    function saveForm() {
      saveSettings({
        regionId: $("regionSelect").value,
        customName: $("customName").value.trim(),
        customStation: $("customStation").value.trim(),
        customWarnArea: $("customWarnArea").value.trim()
      });
      const region = getSelectedRegion();
      $("regionLabel").textContent = region.name.replace("광주광역시 ", "광주 ");
      checkNow().catch(renderError);
    }

    function resetAll() {
      if (!confirm("저장된 설정과 기록을 모두 삭제할까요?")) return;
      localStorage.clear();
      initRegionSelect();
      renderCalendar();
      location.reload();
    }

    $("regionSelect").addEventListener("change", toggleCustom);
    $("saveBtn").addEventListener("click", saveForm);
    $("checkBtn").addEventListener("click", () => checkNow().catch(renderError));
    $("resetBtn").addEventListener("click", resetAll);

    initRegionSelect();
    renderCalendar();

    const saved = loadSettings();
    if (!saved.regionId) saveSettings({ regionId: REGIONS[0].id });
    
    checkNow().catch(renderError);
  </script>
</body>
</html>
